{% include base_path %}

<meta charset="utf-8">

<script>
  // Set the theme before first paint to avoid a light-mode flash.
  // Defaults to dark; the toggle in the masthead persists any user choice.
  (function () {
    var theme = localStorage.getItem("theme") || "dark";
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

</script>
